version: '3.8'
services:
  nexus6-api:
    build: .
    command: uvicorn nexus6.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://user:pass@db:5432/nexus
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  nexus6-dashboard:
    build: .
    command: streamlit run nexus6/dashboard/interface.py --server.port 3000
    ports:
      - "3000:3000"
    environment:
      - API_URL=http://nexus6-api:8000

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=pass
      - POSTGRES_DB=nexus
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
